services:
  arangodb-mcp:
    build: .
    ports:
      - "${MCP_HTTP_PORT:-8000}:8000"
    environment:
      - ARANGO_HOSTS=http://arangodb:8529
      - ARANGO_ROOT_USERNAME=root
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD before running}
      - ARANGO_DEFAULT_DB_NAME=${ARANGO_DEFAULT_DB_NAME:-_system}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_OIDC_ISSUER=${MCP_OIDC_ISSUER:-}
      - MCP_OIDC_AUDIENCE=${MCP_OIDC_AUDIENCE:-}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
      - MCP_OIDC_ALGORITHMS=${MCP_OIDC_ALGORITHMS:-RS256}
      - MCP_OIDC_ACTOR_CLAIM=${MCP_OIDC_ACTOR_CLAIM:-sub}
      - MCP_OIDC_DATABASE_CLAIM=${MCP_OIDC_DATABASE_CLAIM:-arangodb_databases}
      - MCP_OIDC_CLOCK_SKEW_SECONDS=${MCP_OIDC_CLOCK_SKEW_SECONDS:-30}
      - MCP_OIDC_CACHE_TTL_SECONDS=${MCP_OIDC_CACHE_TTL_SECONDS:-300}
      - MCP_OIDC_ALLOW_INSECURE_HTTP=${MCP_OIDC_ALLOW_INSECURE_HTTP:-false}
      - MCP_ARANGO_CREDENTIALS_JSON=${MCP_ARANGO_CREDENTIALS_JSON:-}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_PROTOCOL_MODE=${MCP_PROTOCOL_MODE:-auto}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,arangodb-mcp:*}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*}
      - MCP_PROFILE=${MCP_PROFILE:-readonly}
      - MCP_TOOLSETS=${MCP_TOOLSETS:-}
      - MCP_DENIED_TOOLS=${MCP_DENIED_TOOLS:-}
      - MCP_DENIED_CATEGORIES=${MCP_DENIED_CATEGORIES:-}
      - MCP_RESULT_CONTRACT=${MCP_RESULT_CONTRACT:-v3}
      - MCP_LEGACY_ACTOR_ID=${MCP_LEGACY_ACTOR_ID:-legacy-http}
      - MCP_CONFIRMATION_SECRET=${MCP_CONFIRMATION_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_PATH=${METRICS_PATH:-/metrics}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-arangodb-mcp-server}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-2.0.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS=${OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS:-10}
      - MCP_ACTOR_RATE_LIMIT_PER_MINUTE=${MCP_ACTOR_RATE_LIMIT_PER_MINUTE:-600}
      - MCP_ACTOR_RATE_LIMIT_BURST=${MCP_ACTOR_RATE_LIMIT_BURST:-200}
      - MCP_GLOBAL_MAX_CONCURRENCY=${MCP_GLOBAL_MAX_CONCURRENCY:-64}
      - MCP_CLASS_CONCURRENCY_LIMITS=${MCP_CLASS_CONCURRENCY_LIMITS:-standard=32,query=16,bulk=8,control=4,external=8}
      - MCP_LIMITER_RETRY_AFTER_MS=${MCP_LIMITER_RETRY_AFTER_MS:-250}
      - ENABLE_JS_TRANSACTIONS=${ENABLE_JS_TRANSACTIONS:-false}
    depends_on:
      arangodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  arangodb:
    image: arangodb/arangodb:3.12
    command: ["--experimental-vector-index"]
    ports:
      - "${ARANGO_HTTP_PORT:-8529}:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD before running}
    volumes:
      - arangodb-data:/var/lib/arangodb3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "arangosh --server.endpoint http+tcp://127.0.0.1:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string 'db._version()' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  arangodb-data:
