[project]
name = "arangodb-mcp-server"
version = "2.0.0"
description = "ArangoDB MCP Server - Document, Graph, Search, Sharding & Cluster Operations"
authors = [{ name = "ArangoDB GmbH", email = "info@arangodb.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["dependencies"]

[project.scripts]
arangodb-mcp = "arangodb_mcp.cli:main"

[tool.poetry]
packages = [{ include = "arangodb_mcp", from = "src" }]
include = [
    { path = "src/arangodb_mcp/catalog/tools.yaml", format = ["sdist", "wheel"] },
    { path = "src/arangodb_mcp/manuals/*.md", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
python-arango = "^8.1.0"
mcp = "^1.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
anyio = "^4.5.0"
pyyaml = "^6.0.3"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
httpx = "^0.28.1"
prometheus-client = "^0.26.0"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp-proto-http = "^1.44.0"
starlette = ">=0.47.0"
uvicorn = ">=0.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-timeout = "^2.2.0"
black = "^26.5.1"
isort = "^5.13.0"
mypy = "^1.0.0"
ruff = "^0.8.0"
pytest-cov = "^7.1.0"
pip-audit = "^2.10.1"
types-pyyaml = "^6.0.12.20260724"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # function-call-in-default-argument — standard Pydantic Field() pattern
    "E402",   # module-import-not-at-top-of-file — side-effect imports in server.py/conftest
    "E501",   # line-too-long — enforced by formatter, not linter
    "UP006",  # non-pep585-annotation — project uses typing.Dict/List
    "UP007",  # non-pep604-annotation — project uses Optional[X] (also covers parameters)
    "UP035",  # deprecated-import — project uses typing imports
    "W293",   # whitespace-before-comment — in multiline Field descriptions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not cluster'"
pythonpath = ["src"]
markers = [
    "cluster: tests requiring a cluster deployment (run with '-m cluster')",
    "slow: tests that take a long time to run",
]
timeout = 120
timeout_func_only = true

[tool.coverage.report]
fail_under = 79
show_missing = true
