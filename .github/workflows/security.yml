name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose
          --config /repo/.gitleaks.toml
          /repo

  container-vulnerability-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        # The scan targets the final runtime filesystem; builder-stage SBOM
        # attestations are scanned separately by the release workflow.
        run: docker build --provenance=false --tag arango-solutions-mcp:security-scan .

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arango-solutions-mcp:security-scan
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: security-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Validate release and security contracts
        run: |
          poetry check --lock
          poetry run pytest tests/test_security_contract.py tests/test_deployment_contract.py -q

      - name: Audit installed dependencies
        run: poetry run python -m pip_audit
