name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Documentation consistency
        run: poetry run python scripts/verify_docs.py

      - name: Deterministic quality and retrieval gates
        run: poetry run python evals/run_quality_gates.py --check

      - name: Mypy type check
        run: poetry run python -m mypy --ignore-missing-imports --no-error-summary --disable-error-code=union-attr --disable-error-code=no-any-return --disable-error-code=no-untyped-def --disable-error-code=call-arg --disable-error-code=arg-type --disable-error-code=operator --disable-error-code=assignment src/arangodb_mcp evals/

      - name: Validate project and lock file
        run: poetry check --lock

      - name: Clean wheel installation smoke test
        run: poetry run python scripts/verify_wheel.py

  helm:
    name: Helm lint, schema, and kind smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Helm toolchain
        run: |
          scripts/install_helm_tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Lint, render, and validate chart
        run: scripts/verify_helm.sh

      - name: Install and upgrade on kind
        run: scripts/run_helm_kind_smoke.sh

  test:
    name: Test (Python ${{ matrix.python-version }}, ArangoDB ${{ matrix.arango-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        arango-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tests
        env:
          ARANGO_IMAGE: arangodb/arangodb:${{ matrix.arango-version }}
          ARANGO_TEST_TIMEOUT: "120"
          ENABLE_JS_TRANSACTIONS: "true"
        run: >-
          poetry run pytest tests/ -v
          --ignore=tests/test_cluster.py
          --cov=arangodb_mcp
          --cov-report=term-missing
          --cov-fail-under=79

  phase4-integration:
    name: Phase 4 OIDC and telemetry integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run containerized Phase 4 acceptance harness
        run: python scripts/run_phase4_integration.py --timeout 300
