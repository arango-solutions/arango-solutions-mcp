{{- if .Values.secrets.create.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arangodb-mcp.secretName" . }}
  labels:
    {{- include "arangodb-mcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secrets.keys.arangoPassword }}: {{ required "secrets.create.arangoPassword is required when secrets.create.enabled=true" .Values.secrets.create.arangoPassword | quote }}
  {{- if eq .Values.auth.mode "legacy" }}
  {{ .Values.secrets.keys.authToken }}: {{ required "secrets.create.authToken is required for legacy auth" .Values.secrets.create.authToken | quote }}
  {{- else }}
  {{ .Values.secrets.keys.oidcCredentials }}: {{ required "secrets.create.oidcCredentials is required for OIDC auth" .Values.secrets.create.oidcCredentials | quote }}
  {{- end }}
  {{- if .Values.policy.confirmationSecretEnabled }}
  {{ .Values.secrets.keys.confirmationSecret }}: {{ required "secrets.create.confirmationSecret is required when confirmation signing is enabled" .Values.secrets.create.confirmationSecret | quote }}
  {{- end }}
  {{- if .Values.observability.tracing.headersSecretEnabled }}
  {{ .Values.secrets.keys.otelHeaders }}: {{ required "secrets.create.otelHeaders is required when OTLP secret headers are enabled" .Values.secrets.create.otelHeaders | quote }}
  {{- end }}
  {{- if .Values.embedding.enabled }}
  {{ .Values.secrets.keys.openaiApiKey }}: {{ required "secrets.create.openaiApiKey is required when embeddings are enabled" .Values.secrets.create.openaiApiKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.create.extraData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
